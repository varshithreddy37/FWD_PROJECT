<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haldi Ceremony - Eventify</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo">Eventify</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#events">Events</a>
            <a href="index.html#services">Services</a>
            <a href="index.html#gallery">Gallery</a>
            <a href="index.html#contact" class="btn">Book Event</a>
        </nav>
    </header>

    <section class="event-detail">
        <div class="event-header">
            <h1>Haldi Ceremony</h1>
            <p>Experience the vibrancy and joy of the Haldi ceremony with stunning floral décor and a celebratory atmosphere.</p>
            <a href="index.html#contact" class="btn" onclick="sessionStorage.setItem('selectedEvent','Haldi Ceremony')">Book This Event</a>
        </div>
        
        <div class="event-gallery">
            <h2>Gallery</h2>
            <div class="gallery-grid page-gallery">
                <img src="images/haldi function.jpeg" alt="Haldi 1">
                <img src="images/haldi function.jpeg" alt="Haldi 2">
                <img src="images/haldi function.jpeg" alt="Haldi 3">
            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 Eventify | Designed by Varshith</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
